:root{
  color-scheme:dark;
  --base:var(--brand-obsidian);--surface:var(--brand-carbon);--edge:var(--brand-graphite);
  --cloud:var(--brand-cloud-mineral);--titanium:var(--brand-titanium);
  --teal:var(--brand-apex-teal);--deep-teal:var(--brand-deep-teal);--teal-light:var(--brand-ice-teal);--orange:var(--brand-apex-orange);
  --radius:19px;--shell:1320px;
  font:15px/1.5 Onest,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--cloud);min-width:280px}
a{color:var(--teal-light);text-underline-offset:.22em}
button,input,select{font:inherit}
button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--teal-light);outline-offset:4px}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.18;letter-spacing:-.025em}
h1{font-size:clamp(2.1rem,5vw,4.2rem);font-weight:770}
h2{font-size:clamp(1.5rem,3vw,2.2rem)}
h3{font-size:1.05rem}
.shell{width:min(calc(100% - 56px),var(--shell));margin-inline:auto}
.skip{position:absolute;left:16px;top:12px;padding:10px;background:var(--surface);transform:translateY(-160%);z-index:2}
.skip:focus{transform:none}
.top{background:var(--surface);border-bottom:1px solid var(--edge)}
.top-inner,.territories,.sections{display:flex;align-items:center;gap:14px}
.top-inner{justify-content:space-between;min-height:75px}
.logo{display:inline-flex;flex:none;padding-block:8px}
.logo img{display:block;object-fit:cover;object-position:center bottom;width:146px;height:19px}
.territories{background:var(--base);border:1px solid var(--edge);padding:4px;border-radius:12px;gap:4px}
.territories a,.sections a{text-decoration:none;color:var(--titanium);font-weight:630;white-space:nowrap}
.territories a{padding:7px 14px;border:1px solid transparent;border-radius:8px}
.territories a[aria-current]{border-color:var(--teal);background:var(--deep-teal);color:var(--cloud)}
.sections{gap:clamp(15px,4vw,42px);overflow-x:auto;scrollbar-width:thin;padding-top:1px}
.sections a{padding:12px 0 14px;border-bottom:2px solid transparent}
.sections a:hover,.sections a[aria-current]{color:var(--cloud)}
.sections a[aria-current]{border-color:var(--teal)}
.sections a[data-section=crm]{margin-inline-start:auto;color:var(--teal-light)}
main{padding:30px 0 52px}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:218px;display:grid;align-content:center;gap:16px;padding:clamp(22px,5vw,60px);border-radius:var(--radius);border:1px solid var(--edge);background:linear-gradient(112deg,var(--base) 12%,color-mix(in srgb,var(--deep-teal) 30%,var(--base)) 100%);margin-bottom:26px}
.hero::before{content:"";position:absolute;z-index:-1;inset:-110% -5% -110% 39%;background:repeating-radial-gradient(ellipse at 67% 46%,transparent 0 17px,var(--teal-light) 18px 19px,transparent 20px 32px);transform:rotate(-24deg) scaleX(1.45);opacity:.08;mask-image:linear-gradient(100deg,transparent,#000 55%)}
.hero::after{content:"";position:absolute;z-index:-1;top:16px;right:16px;width:74px;height:33px;border-top:1px solid var(--orange);border-right:1px solid var(--orange);opacity:.47}
.hero .cut{position:absolute;z-index:-1;inset:auto 0 0 auto;width:19%;height:88%;clip-path:polygon(84% 0,100% 0,100% 100%,0 100%);background:var(--teal);opacity:.06;pointer-events:none}
.hero p{color:var(--titanium);max-width:60ch}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;background:var(--surface);border:1px solid var(--edge);border-radius:999px;color:var(--cloud);font-size:.82rem;line-height:1.3}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal)}
.block{margin-top:35px}
.block-head,.section-heading{margin-bottom:15px;display:flex;justify-content:space-between;gap:15px;align-items:flex-end}
.block-head p,.section-heading p{color:var(--titanium);max-width:74ch;margin-top:8px}
.metric-grid,.chart-grid,.calc-results{display:grid;gap:14px}
.metric-grid{grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.chart-grid{grid-template-columns:repeat(auto-fit,minmax(min(350px,100%),1fr));margin-top:14px}
.card,.metric,.result{background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius);padding:21px;min-width:0}
.metric{display:flex;flex-direction:column;gap:6px;border-top-color:var(--deep-teal)}
.metric dt{color:var(--titanium);font-size:.91rem;font-weight:620}
.metric dd{margin:0;font-size:clamp(1.55rem,3.5vw,2.25rem);font-weight:760;line-height:1.12;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.metric dd small{font-size:.96rem;letter-spacing:0;color:var(--titanium)}
.metric p,.fine,.chart-note,.calc-note,.scope-note{color:var(--titanium);font-size:.86rem}
.metric a{font-size:.8rem;margin-top:auto}
.metric-grid dl{margin:0}
.chart-head{display:grid;gap:6px;margin-bottom:17px}
.chart-head p,.chart-note{color:var(--titanium)}
.chart-note{margin-top:15px}
.source-ref{display:inline-block;font-size:.8rem;margin-top:10px}
.donut-grid{display:grid;grid-template-columns:minmax(112px,156px) minmax(0,1fr);gap:20px;align-items:center}
.donut{width:100%;aspect-ratio:1;position:relative;display:grid;place-items:center;margin:auto;border-radius:50%}
.donut::before{content:"";position:absolute;inset:17%;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--edge)}
.donut-center{position:relative;text-align:center;font-size:clamp(.86rem,2.4vw,1.4rem);font-weight:760;font-variant-numeric:tabular-nums}
.legend,.bars{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.legend li{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend-dot{width:8px;height:8px;border-radius:50%;background:var(--datum)}
.legend span,.bars span{font-size:.86rem}
.legend strong,.bars strong{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.legend strong small{display:block;font-size:.75rem;color:var(--titanium);font-weight:500}
.bar-row{display:flex;justify-content:space-between;gap:10px}
.track{height:8px;background:var(--edge);border-radius:999px;overflow:hidden;margin-top:5px}
.track span{display:block;height:100%;border-radius:inherit;background:var(--teal)}
.columns{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;height:190px;padding:12px 0 0;background:repeating-linear-gradient(0deg,transparent 0 43px,var(--edge) 44px 45px)}
.column{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;text-align:center}
.column-plot{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px}
.column-plot span{display:block;background:var(--teal);width:min(64%,76px);border-radius:5px 5px 0 0;min-height:3px}
.column:nth-child(odd) .column-plot span{background:var(--teal-light)}
.column-plot strong{font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.column small{padding-top:7px;background:var(--surface);color:var(--titanium)}
.table-wrap{width:100%;overflow:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;text-align:left}
th,td{padding:12px 13px;border-bottom:1px solid var(--edge);vertical-align:top}
th{font-size:.82rem;color:var(--titanium);font-weight:660}
td.numeric,th.numeric{text-align:right;font-variant-numeric:tabular-nums}
td strong{color:var(--cloud)}
.range-table{min-width:490px}
.source-details{margin-top:12px}
.source-details summary{color:var(--teal-light);font-size:.9rem;font-weight:620;cursor:pointer}
.source-list{display:grid;gap:10px;margin-top:13px;padding-left:22px}
.source-list p{color:var(--titanium)}
.scope-note{margin-top:13px}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--edge);padding-block:20px;color:var(--titanium);font-size:.83rem}
.footer strong{color:var(--cloud)}
.button,.quick-picks button,.scenario-table button{display:inline-flex;justify-content:center;align-items:center;border-radius:9px;border:1px solid var(--brand-field-border);background:var(--brand-teal-wash);color:var(--cloud);padding:9px 13px;font-weight:650;text-decoration:none}
.button.primary{background:var(--orange);border-color:var(--orange);color:var(--base)}
.button.secondary{background:var(--surface)}
.button:hover,.quick-picks button:hover,.scenario-table button:hover{background:var(--edge);border-color:var(--teal-light)}
.button.primary:hover{background:var(--cloud);border-color:var(--orange)}
.button.small{font-size:.82rem;padding:6px 9px}
.callout{padding:14px 16px;background:var(--brand-teal-wash);border-radius:11px;border-left:2px solid var(--teal);margin-top:14px}
.callout p{margin-top:6px}
.note{border-left:2px solid var(--orange);padding-left:11px;color:var(--titanium)}
.crm-tab{padding-bottom:40px}
.crm-heading{padding-block:22px}
.crm-heading h1{font-size:clamp(1.5rem,3vw,2.2rem)}
.crm-frame{display:block;width:100%;height:78vh;min-height:470px;border:1px solid var(--edge);border-radius:var(--radius);background:var(--surface)}
.honeycomb{position:relative;isolation:isolate;overflow:hidden}
.honeycomb::before{content:"";position:absolute;inset:0 0 0 48%;z-index:-1;opacity:.08;mask-image:linear-gradient(90deg,transparent,#000);background-image:linear-gradient(30deg,var(--teal-light) 1px,transparent 1px),linear-gradient(150deg,var(--teal-light) 1px,transparent 1px),linear-gradient(30deg,var(--teal-light) 1px,transparent 1px),linear-gradient(150deg,var(--teal-light) 1px,transparent 1px),linear-gradient(60deg,transparent 71%,var(--teal-light) 72% 74%,transparent 75%),linear-gradient(60deg,transparent 71%,var(--teal-light) 72% 74%,transparent 75%);background-size:35px 60px;background-position:0 0,0 0,17.5px 30px,17.5px 30px,0 0,17.5px 30px}
.basket-card,.calc-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.basket-card{border-color:var(--deep-teal);background:linear-gradient(115deg,var(--brand-teal-wash),var(--surface));margin-bottom:16px}
.basket-card h3{font-size:1.65rem;margin-block:8px}
.basket-caption{color:var(--teal-light);font-weight:660}
.basket-mini{display:grid;gap:8px}
.basket-mini>div,.range-ends,.margin-line,.progress-caption{display:flex;align-items:center;justify-content:space-between;gap:12px}
.basket-mini>div{border-bottom:1px solid var(--edge);padding-bottom:4px}
.basket-mini span,.range-ends{font-size:.85rem;color:var(--titanium)}
.calc-inputs>label{font-weight:620}
.points-control{display:flex;align-items:center;gap:12px;margin:12px 0}
input[type=number]{width:100%;border:1px solid var(--brand-field-border);border-radius:8px;background:var(--base);color:var(--cloud);padding:8px 10px}
.points-control input{max-width:130px;font-size:1.27rem}
input[type=range]{accent-color:var(--teal);width:100%}
.quick-picks,.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.margin-line{margin-bottom:8px}
.margin-line input{max-width:94px}
.progress-card{padding:11px 12px;background:var(--base);border-radius:11px;margin-top:10px}
.progress-card .fine,.calc-note{margin-top:8px}
.result .big-number{font-size:clamp(1.25rem,2.8vw,2rem);font-weight:750;margin-block:6px;color:var(--teal-light)}
.result.primary{border-color:var(--deep-teal);background:var(--brand-teal-wash)}
.result small{color:var(--titanium)}
.calc-results{grid-template-columns:repeat(2,minmax(0,1fr))}
.calc-basket,.wide-card{margin-top:16px}
.card-head{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.basket-table,.scenario-table{min-width:520px}
.basket-settings{margin-bottom:16px}
.basket-settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.basket-product{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:6px 12px 12px;min-width:0;border:1px solid var(--edge);border-radius:11px}
.basket-product legend{padding-inline:5px;font-weight:650}
.basket-settings-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:12px}
.basket-settings-footer input{max-width:160px}
.basket-settings-footer .fine{margin-top:5px}
.field{display:grid;gap:4px;font-size:.86rem;margin-top:5px}
.scenario-table button{padding:2px 7px}
.muted{color:var(--titanium)}
#toast{display:none;position:fixed;z-index:2;bottom:18px;right:18px;max-width:calc(100% - 36px);padding:10px 14px;background:var(--surface);border:1px solid var(--edge);border-radius:9px}
#toast.show{display:block}
.embedded .top,.embedded .footer{display:none}
.embedded main{padding-block:16px}
@media(max-width:780px){
  .shell{width:calc(100% - 32px)}
  .calc-layout,.basket-card{grid-template-columns:1fr}
  .section-heading,.block-head{align-items:flex-start;flex-direction:column}
  .basket-product{grid-template-columns:1fr}
}
@media(max-width:490px){
  .shell{width:calc(100% - 24px)}
  .top-inner{flex-wrap:wrap;gap:2px;min-height:0;padding-block:10px}
  .territories{flex:1 1 100%}
  .territories a{text-align:center;flex:1;padding-inline:5px}
  .sections{gap:13px}
  .sections a{font-size:.78rem;white-space:normal;line-height:1.24}
  .sections a[data-section=crm]{margin:0}
  main{padding-top:14px}
  .hero{min-height:0}
  .card,.metric,.result{padding:14px}
  .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .metric dd{font-size:1.4rem;overflow-wrap:anywhere}
  .metric dd small{font-size:.78rem}
  .donut-grid{grid-template-columns:minmax(74px,100px) minmax(0,1fr);gap:12px}
  .columns{gap:6px}
  .column-plot strong{font-size:.74rem}
  .basket-settings-grid{grid-template-columns:1fr}
  .basket-product{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.kbr-catalog-layout { display:grid; grid-template-columns:minmax(208px, .7fr) minmax(0, 2.3fr); gap:16px; margin:20px 0; align-items:start; }
.kbr-catalog-nav { display:grid; gap:12px; }
.kbr-catalog-nav .button { justify-self:start; }
.kbr-search { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; }
.kbr-search label { display:grid; gap:7px; font-size:.9rem; }
.kbr-search input,.kbr-search select { min-width:0; border:1px solid var(--brand-graphite); border-radius:7px; background:var(--brand-obsidian); color:var(--brand-cloud-mineral); padding:10px; font:inherit; }
.kbr-catalog-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.kbr-lead { overflow-wrap:anywhere; }
.kbr-lead h3 { margin:7px 0; }
.kbr-lead small { color:var(--brand-titanium); }
.kbr-lead p { margin:7px 0; }
.kbr-lead-links,.kbr-pager { display:flex; flex-wrap:wrap; gap:12px; }
.kbr-pager button:disabled { opacity:.45; cursor:default; }
.embedded .kbr-catalog-nav { display:grid; }
@media(max-width:780px) { .kbr-catalog-layout { grid-template-columns:1fr; } .kbr-catalog-list { grid-template-columns:1fr; } }
@media(max-width:560px) { .kbr-search { grid-template-columns:1fr; } }
@media(max-width:780px){.territories{min-width:0;align-items:stretch}.territories a{white-space:normal;min-width:0;overflow-wrap:anywhere;display:grid;place-items:center}}</style>

  <script>function calculate(points,margin=20,base=0){
 const n=Number(points),m=Number(margin);
 points=Math.min(1000000,Math.max(0,Math.floor(Number.isFinite(n)?n:0)));
 margin=Math.round(Math.min(100,Math.max(0,Number.isFinite(m)?m:20))*10)/10;
 const perPoint=13000+30000+3*52000,turnover=points*perPoint,contribution=Math.round(turnover*margin/100);
 return {points,margin,base,perPoint,turnover,contribution,annualTurnover:turnover*12,annualContribution:contribution*12,rolls:points*5,progress:base>0?Math.min(100,points/base*100):0,share:base>0?points/base*100:0};
}

function scenarioNumber(value) {
  return typeof value === 'number' && Number.isFinite(value) && value >= 0 && value <= 10000000;
}

function readScenario() {
  let values;
  try {
    values = JSON.parse(localStorage.getItem(scenarioKey()));

  for (const key of Object.keys(defaultBasket)) {
    const value = query.has(key) ? Number(query.get(key)) : values?.basket?.[key];
    if (scenarioNumber(value)) basket[key] = value;
  }
  const savedTarget = query.has('target') ? Number(query.get('target')) : values?.target;
  if (scenarioNumber(savedTarget) && Number.isInteger(savedTarget)) target = savedTarget;

function applyScenarioToUrl(url) {
  for (const key of Object.keys(defaultBasket)) url.searchParams.set(key, basket[key]);
  url.searchParams.set('target', target);
}

function calculateRegional(points, margin, base) {
  const result = calculate(points, margin, base);
  const perPoint = products.reduce((total, [, key]) => total + basket[key+'Qty'] * basket[key+'Price'], 0);
  const perPointRolls = products.reduce((total, [, key]) => total + basket[key+'Qty'], 0);
  const turnover = result.points * perPoint;
  const contribution = Math.round(turnover * result.margin / 100);
  return Object.assign(result, {
    perPoint, perPointRolls, turnover, contribution, rolls: result.points * perPointRolls,
    annualTurnover: turnover * 12, annualContribution: contribution * 12,
  });
}

})[ch]);
const formatDate = value => value.split('-').reverse().join('.');
const getArea = () => { const key = new URLSearchParams(location.search).get('area'); return Object.hasOwn(DATA.views, key) ? key : 'region'; };
const getSection = () => {
  const hash = location.hash.slice(1);
  if (hash === 'calculator') return 'model';
  if (hash === 'prices') return 'overview'; if (hash === 'leads') return 'crm';
  return validSections.includes(hash) ? hash : 'market';
};
const view = () => DATA.views[area];
let area = getArea();
let query = new URLSearchParams(location.search);
let S = modelBase();
const state = {calc: null};
let frame;
let toastTimer;
loadModel();

if (window !== parent && query.get('embed') === 'cabinet') {
  document.documentElement.classList.add('embedded');
}
document.getElementById('footerDate').textContent =
  'База исследования · ' + formatDate(DATA.dataDate) + '    |    Сборка · ' + formatDate(DATA.researchDate);

function modelBase() {
  return {total: view().stats.confirmed};
}

function loadModel() {
  basket = {...defaultBasket};
  target = defaultTarget;
  const saved = readScenario();
  state.calc = calculateRegional(query.get('points') ?? saved?.points ?? 10,
    query.get('margin') ?? saved?.margin ?? 20, S.total);
}

function toast(label) {
  const message = document.getElementById('toast');
  message.textContent = label;
  message.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => message.classList.remove('show'), 2800);
}

function heading(title, description, aside = '') {
  return `<div class="section-heading"><div><h2>${title}</h2><p>${description}</p></div>${aside}</div>`;
}

function hero(title, description = '') {
  return `<section class="hero"><span class="cut" aria-hidden="true"></span>
    <div class="hero-meta"><span class="tag">${esc(view().label)}</span><span class="tag">Проверено ${formatDate(DATA.researchDate)}</span></div>
    <h1>${esc(title)}</h1>${description ? `<p>${esc(description)}</p>` : ''}</section>`;
}

function sourceLink(id, label) {
  const source = DATA.sources[id];
  if (!source?.url) return '';
  return `<a class="source-ref" href="${esc(source.url)}" rel="noopener noreferrer" target="_blank">${esc(label || source.name)} ↗</a>`;
}

function metric(item) {
  const value = num(item.value);
  const prefix = item.approx ? '≈ ' : '';
  const sign = item.signed && item.value > 0 ? '+' : '';
  return `<dl class="metric"><dt>${esc(item.label)}</dt><dd>${prefix}${sign}${value}${item.unit ? ` <small>${esc(item.unit)}</small>` : ''}</dd>
    <div><p>${esc(item.period || '')}</p>${sourceLink(item.source)}</div></dl>`;
}

function seriesLegend(items, colors, total) {
  return `<ul class="legend">${items.map(([label, value], index) =>
    `<li><i class="legend-dot" style="--datum:${colors[index % colors.length]}" aria-hidden="true"></i><span>${esc(label)}</span>
      <strong>${num(value)} <small>${pct(value / total * 100)}</small></strong></li>`).join('')}</ul>`;
}

function donut(items, center) {
  const total = items.reduce((sum, [, value]) => sum + value, 0);
  if (!total) return '<p class="fine">В этом срезе 0 записей.</p>';
  let start = 0;
  const stops = items.map(([, value], index) => {
    const end = start + value / total * 100;
    const segment = `${palette[index % palette.length]} ${start}% ${end}%`;
    start = end;
    return segment;
  });
  return `<div class="donut-grid"><div class="donut" style="background:conic-gradient(${stops.join(',')})" aria-hidden="true">
    <span class="donut-center">${esc(center || compact.format(total))}</span></div>${seriesLegend(items, palette, total)}</div>`;
}

function bars(items) {
  const highest = Math.max(...items.map(([, value]) => value), 1);
  return `<ul class="bars">${items.map(([label, value]) => `<li><div class="bar-row"><span>${esc(label)}</span><strong>${num(value)}</strong></div>
    <div class="track" aria-hidden="true"><span style="width:${100 * value / highest}%"></span></div></li>`).join('')}</ul>`;
}

function columns(items, unit) {
  const upper = Math.max(...items.map(([, value]) => value), 1) * 1.2;
  return `<div class="columns" role="group" aria-label="${esc(unit || 'Значения')}">${items.map(([label,value]) =>
    `<div class="column"><div class="column-plot"><strong>${num(value)}</strong><span style="height:${100 * value / upper}%" aria-hidden="true"></span></div><small>${esc(label)}</small></div>`).join('')}</div>`;
}

function chart(item) {
  const content = item.type === 'donut' ? donut(item.items, item.center)
    : item.type === 'columns' ? columns(item.items, item.unit) : bars(item.items);
  return `<section class="card"><div class="chart-head"><h3>${esc(item.title)}</h3>
    ${item.subtitle ? `<p class="fine">${esc(item.subtitle)}</p>` : ''}</div>${content}
    ${item.note ? `<p class="chart-note">${esc(item.note)}</p>` : ''}${sourceLink(item.source)}</section>`;
}

function market() {
  const sections = view().market;
  const ids = [...new Set(sections.flatMap(section => [...section.metrics, ...section.charts].map(item => item.source)))];
  return hero(view().territory, 'Население, покупательский контекст и автомобильный рынок') +
    sections.map(section => `<section class="block"><header class="block-head"><div><h2>${esc(section.title)}</h2>
    <p>${esc(section.description)}</p></div></header><div class="metric-grid">${section.metrics.map(metric).join('')}</div>
    <div class="chart-grid">${section.charts.map(chart).join('')}</div></section>`).join('') +
    marketTable(sections) + `<section class="card block"><h2>Границы данных</h2><ul>${DATA.limitations.map(note=>`<li>${esc(note)}</li>`).join('')}</ul></section>` +
    `<section class="card block"><h2>Источники и методика</h2><details class="source-details"><summary>Открыть список источников</summary>
    <ul class="source-list">${ids.map(id => `<li>${sourceLink(id)}<p>${esc(DATA.sources[id].note)}</p></li>`).join('')}</ul></details></section>`;
}

function marketTable(sections) {
  return `<section class="card block"><h2>Все рыночные показатели</h2>
    <div class="table-wrap"><table class="range-table"><thead><tr><th>Показатель</th><th class="numeric">Значение</th><th>Период и охват</th><th>Источник</th></tr></thead>
    <tbody>${sections.flatMap(section => section.metrics).map(item => `<tr><td>${esc(item.label)}</td>
    <td class="numeric">${item.approx?'≈ ':''}${num(item.value)} ${esc(item.unit || '')}</td>
    <td>${esc(item.period)}</td><td>${sourceLink(item.source)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

function leads() {
  const s = view().stats;
  const topCities = s.cities.slice(0, 7);
  const other = s.cities.slice(7).reduce((total, [, count]) => total + count, 0);
  if (other) topCities.push(['Прочие населённые пункты', other]);
  const period = 'Срез ' + formatDate(DATA.dataDate);
  const cards = [
    {label:'Точек исследовано',value:s.total,period},
    {label:'Профиль подтверждён',value:s.confirmed,period:pct(s.confirmed/s.total*100)+' от исследованных'},
    {label:'Кандидаты',value:s.candidates,period:'Услуга требует проверки'},
    {label:'Точки с ценами',value:s.withAmounts,period:num(s.pricePositions)+' опубликованных позиций'},
  ];
  const charts = [
    {title:'Квалификация',type:'donut',items:[['Подтверждённые',s.confirmed],['Кандидаты',s.candidates]]},
    {title:'Подтверждённые услуги',type:'donut',items:[['Тонировка',s.tintOnly],['Оклейка',s.wrapOnly],['Обе услуги',s.both]],subtitle:'Три непересекающиеся группы'},
    {title:'Источники исследования',type:'donut',items:s.sources,subtitle:'Уникальные точки после сверки'},
    area === 'region'
      ? {title:'География точек',type:'bars',items:topCities,subtitle:'Количество точек по населённым пунктам'}
      : {title:'Доступность телефона',type:'donut',items:[['Телефон указан',s.phones],['Без телефона',s.total-s.phones]]},
  ];
  return hero('Рыночная обстановка', 'Квалификация рынка, услуги и открытые цены') +
    `<section class="metric-grid">${cards.map(metric).join('')}</section>
    <section class="block"><header class="block-head"><div><h2>Структура рынка</h2><p>Исследованные точки оклейки и тонировки · ${esc(view().label)}</p></div></header>
      <div class="chart-grid">${charts.map(chart).join('')}</div></section>
    <section class="card block">
      <h2>Опубликованные цены на работы</h2><p class="scope-note">${num(s.pricePositions)} поз. у ${num(s.withAmounts)} точек. Ниже до 24 распространённых объёмов с ценами минимум двух компаний. Все опубликованные суммы доступны в карточках.</p>
      <div class="table-wrap"><table class="range-table"><thead><tr><th>Работы</th><th class="numeric">Нижняя цена</th><th class="numeric">Верхняя цена</th><th class="numeric">Позиций</th><th class="numeric">Из них «от»</th></tr></thead>
      <tbody>${s.prices.map(item => `<tr><td>${esc(item.label)}</td><td class="numeric">${money(item.low)}</td><td class="numeric">${money(item.high)}</td><td class="numeric">${num(item.count)}</td><td class="numeric">${num(item.fromCount)}</td></tr>`).join('')}</tbody></table></div>
    </section>
    <section class="card block honeycomb"><div class="block-head"><div><h2>Работа с компаниями</h2><p>Откройте список компаний с контактами из исследования. Этапы и история работы доступны после входа в CRM.</p></div>
    <a class="button primary" href="#crm" data-section="crm">Открыть ЛИДы и СРМ</a></div></section>`;
}

function model() {
  return hero('Деньги в рынке', 'Оборот и маржинальный доход по сценарию продаж') + calculator();
}

function basketSettings() {
  const field = (key, label, value, name = label) => `<label class="field"><span>${label}</span>
    <input type="number" id="${key}" data-basket-key="${key}" aria-label="${name}" value="${value}" min="0" max="10000000"
      step="${key === 'target' ? '1' : 'any'}" inputmode="${key === 'target' ? 'numeric' : 'decimal'}"></label>`;
  const editor = ([label, key]) => `<fieldset class="basket-product"><legend>${label} плёнка</legend>
    ${field(key + 'Qty', 'Рулонов на точку', basket[key + 'Qty'], label + ' плёнка, рулонов на точку')}
    ${field(key + 'Price', 'Цена рулона, ₽', basket[key + 'Price'], label + ' плёнка, цена рулона в рублях')}
  </fieldset>`;
  return `<section class="card basket-settings" aria-labelledby="basket-settings-title">
    <div class="card-head"><h3 id="basket-settings-title">Параметры корзины</h3><p class="fine">Цены и количество рулонов можно менять вручную</p></div>
    <div class="basket-settings-grid">${products.map(editor).join('')}</div>
    <div class="basket-settings-footer"><div>
      ${field('target', 'Цель подключения, точек', target)}<p class="fine" id="targetProgress"></p>
    </div><div class="row-actions">
      <button class="button secondary small" id="resetBasket">Сбросить корзину</button>
      <button class="button secondary small" id="resetScenario">Сбросить весь сценарий</button>
    </div></div>
  </section>`;
}

function resetScenario(resetAll) {
  basket = {...defaultBasket};
  const keys = Object.keys(defaultBasket);
  if (resetAll) {
    target = defaultTarget;
    keys.push('target', 'points', 'margin');
  }
  const url = new URL(location.href);
  for (const key of keys) url.searchParams.delete(key);
  if (url.href !== location.href) history.replaceState(history.state, '', url.href);
  query = url.searchParams;
  state.calc = calculateRegional(resetAll ? 10 : state.calc.points, resetAll ? 20 : state.calc.margin, S.total);
  render();
  document.getElementById(resetAll ? 'resetScenario' : 'resetBasket').focus();
}

function areaUrl(nextArea, section) {
  const url = new URL(location.href);
  if (nextArea !== area) {
    for (const key of ['points', 'margin', 'target', ...Object.keys(defaultBasket)]) url.searchParams.delete(key);
  }
  url.searchParams.set('area', nextArea);
  url.hash = section;
  return url.href;
}

let lastLocation;
const catalogFilters = {};
const link = (url, label) => /^https?:\/\//i.test(url || '')
  ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>` : '';

function renderCatalog() {
  const selected = view();
  const saved = catalogFilters[area] ??= {query:'', profile:'all', price:'all', start:0};
  const backToCrm = query.get('embed') === 'cabinet' && window !== parent;
  const crmAction = backToCrm ? '<button type="button" class="button secondary" id="returnCrm">Вернуться в CRM</button>'
    : `<a class="button primary" href="${esc(DATA.crm)}">Заявки · вход в CRM ↗</a>`;
  crmTab.innerHTML = hero('Список ЛИДов', 'Оклейка и тонировка · публичный срез исследования') + `
    <div class="kbr-catalog-layout"><aside class="card kbr-catalog-nav" aria-label="Рабочие разделы">
      <h2>ЛИДы и СРМ</h2><a href="#crm">Список ЛИДов</a>${crmAction}
      ${link(DATA.sheet, 'Данные в Google Таблице')}${selected.csv ? link(new URL(encodeURIComponent(selected.csv), location.href).href, 'Выгрузка текущей территории') : ''}
    </aside><div><section class="card kbr-search">
      <label>Название, адрес или телефон<input type="search" id="catalogQuery" value="${esc(saved.query)}" autocomplete="off"></label>
      <label>Услуга<select id="catalogProfile"><option value="all">Все</option><option value="wrap">Оклейка</option><option value="tint">Тонировка</option><option value="both">Обе услуги</option><option value="candidate">Кандидаты</option></select></label>
      <label>Цены<select id="catalogPrice"><option value="all">Все</option><option value="with">С ценами</option><option value="without">Без цен</option></select></label>
    </section><p id="catalogCount" class="fine" aria-live="polite"></p><div class="kbr-catalog-list" id="catalogList"></div>
      <p class="kbr-pager"><button type="button" id="catalogPrevious" class="button secondary">Назад</button>
      <button type="button" id="catalogNext" class="button secondary">Дальше</button></p></div></div>`;

  const queryBox = document.getElementById('catalogQuery');
  const profileBox = document.getElementById('catalogProfile');
  const priceBox = document.getElementById('catalogPrice');
  const next = document.getElementById('catalogNext');
  const previous = document.getElementById('catalogPrevious');
  if (backToCrm) document.getElementById('returnCrm').onclick = () => parent.postMessage({type:'fiverox-kbr-research', command:'return'}, location.origin);
  profileBox.value = saved.profile;
  priceBox.value = saved.price;

  function displayRows() {
    const keyword = saved.query.toLowerCase().trim();
    const rows = selected.ids.map(id => DATA.contacts[id]).filter(row => {
      if (!`${row.name} ${row.address} ${row.city} ${row.phone ?? ''} ${row.id}`.toLowerCase().includes(keyword)) return false;
      if (saved.price !== 'all' && (saved.price === 'with') !== Boolean(row.prices.length)) return false;
      return saved.profile === 'all' || (saved.profile === 'wrap' && row.wrap) || (saved.profile === 'tint' && row.tint)
        || (saved.profile === 'both' && row.wrap && row.tint) || (saved.profile === 'candidate' && !row.wrap && !row.tint);
    });
    const pageSize = 24;
    saved.start = Math.min(saved.start, Math.max(0, Math.floor((rows.length - 1) / pageSize) * pageSize));
    const end = Math.min(saved.start + pageSize, rows.length);
    document.getElementById('catalogCount').textContent = `Показано ${rows.length ? saved.start + 1 : 0}–${end} из ${rows.length} · в срезе ${selected.stats.total} карточек`;
    document.getElementById('catalogList').innerHTML = rows.slice(saved.start, end).map(row => `<article class="card kbr-lead">
      <small>${esc(row.city)} · ${esc(row.id)}</small><h3>${esc(row.name)}</h3><strong>${esc(row.profile)}</strong>
      <p>${esc(row.address || 'Адрес не опубликован')}</p><p>${esc(row.phone || 'Телефон не опубликован')}</p>
      <p class="kbr-lead-links">${link(row.url, 'Яндекс Карты')}${link(row.twoGisUrl, '2ГИС')}</p>
      ${row.prices.length ? `<details><summary>Опубликованные цены (${row.prices.length})</summary><ul>${row.prices.map(p => `<li>${esc(p.service)} · ${esc(p.scope)} · ${esc(p.type === 'От' ? 'от ' : '')}${money(p.value)}<br>${esc(p.status)} · ${esc(p.date)} · ${link(p.url,'Источник')}</li>`).join('')}</ul></details>` : ''}
    </article>`).join('') || '<p class="card">По этим фильтрам карточек нет.</p>';
    previous.disabled = saved.start === 0;
    next.disabled = end >= rows.length;
    previous.onclick = () => {saved.start -= pageSize; displayRows();};
    next.onclick = () => {saved.start += pageSize; displayRows();};
  }
  queryBox.oninput = () => {saved.query = queryBox.value; saved.start = 0; displayRows();};
  profileBox.onchange = () => {saved.profile = profileBox.value; saved.start = 0; displayRows();};
  priceBox.onchange = () => {saved.price = priceBox.value; saved.start = 0; displayRows();};
  displayRows();
}

function render() {
  const section = getSection();
  document.title = 'FIVEROX · ' + view().territory;
  document.querySelectorAll('.territories [data-area]').forEach(node => {
    node.href = areaUrl(node.dataset.area, section);
    node.toggleAttribute('aria-current', node.dataset.area === area);
    if (node.dataset.area === area) node.setAttribute('aria-current', 'page');
  });
  document.querySelectorAll('.sections [data-section]').forEach(node => {
    node.toggleAttribute('aria-current', node.dataset.section === section);
    if (node.dataset.section === section) node.setAttribute('aria-current', 'page');
  });
  main.hidden = section === 'crm';
  crmTab.hidden = section !== 'crm';
  if (section === 'crm') {
    renderCatalog();
    return;
  }
  main.innerHTML = {market, overview: leads, model}[section]();
  if (section === 'model') updateCalc();
}

function syncLocation() {
  if (location.href === lastLocation) return;
  lastLocation = location.href;
  const next = getArea();
  if (next !== area) {
    area = next;
    query = new URLSearchParams(location.search);
    S = modelBase();
    loadModel();
  }
  render();
}

document.addEventListener('click', event => {
  const link = event.target.closest('a[data-area], a[data-section], .logo');
  if (!link || event.button || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  const section = link.dataset.area ? getSection() : link.dataset.section || 'market';
  const nextArea = link.dataset.area || area;
  event.preventDefault();
  const next = areaUrl(nextArea, section);
  if (next !== location.href) history.pushState(null, '', next);
  syncLocation();
});
window.addEventListener('popstate', syncLocation);
window.addEventListener('hashchange', syncLocation);
document.querySelector('.skip').addEventListener('click', event => {
  event.preventDefault();
  const content = getSection() === 'crm' ? crmTab : main;
  content.focus();
  content.scrollIntoView({block:'start'});
});

main.addEventListener('input', event => {
  const input = event.target;
  if (input.matches('[data-basket-key]')) {
    updateBasketInput(input);
  } else if (input.id === 'pointsRange') {
    setPoints(input.valueAsNumber);
  } else if (['points','margin'].includes(input.id) && input.value !== '' && Number.isFinite(input.valueAsNumber)) {
    state.calc = input.id === 'points'
      ? calculateRegional(input.valueAsNumber, state.calc.margin, S.total)
      : calculateRegional(state.calc.points, input.valueAsNumber, S.total);
    updateCalc();
  }
});
main.addEventListener('focusout', event => {
  const input = event.target;
  if (['points','margin'].includes(input.id)) input.value = state.calc[input.id];
  if (input.matches('[data-basket-key]')) {
    const key = input.dataset.basketKey;
    input.value = key === 'target' ? target : basket[key];
  }
});
function setPoints(value) {
  state.calc = calculateRegional(value, state.calc.margin, S.total);
  document.getElementById('points').value = state.calc.points;
  updateCalc();
}
main.addEventListener('click', async event => {
  const button = event.target.closest('button');
  if (button?.hasAttribute('data-points')) setPoints(Number(button.dataset.points));
  if (['resetBasket','resetScenario'].includes(button?.id)) resetScenario(button.id === 'resetScenario');
  if (button?.id === 'shareCalc') {
    const url = new URL(location.href);
    url.searchParams.set('points', state.calc.points);
    url.searchParams.set('margin', state.calc.margin);
    applyScenarioToUrl(url);
    try {
      await navigator.clipboard.writeText(url.href);
      toast('Ссылка на расчёт скопирована');
    } catch {
      history.replaceState(null, '', url.href);
      toast('Ссылка на расчёт сохранена в адресе страницы');
    }
  }
});
lastLocation = location.href;
render();

})();
</script>
